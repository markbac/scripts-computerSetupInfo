# Linux and WSL packages. Tested against Ubuntu 24.04 package names.
#
# Every top-level key has the same shape:
#   base:     safe for a work machine
#   personal: added on top when profile is "personal"
#
# Both keys must be present, even when empty. tests/validate_config.py checks this.

apt:
  base:
    # essentials and build tools
    - nano
    - build-essential
    - procps
    - curl
    - wget
    - openssh-client
    - file
    - cmake
    - git
    - git-lfs
    - gh
    - git-delta
    - pkg-config
    - ninja-build
    - unzip
    - gpg
    - gnupg
    - ca-certificates
    - apt-transport-https
    - software-properties-common
    - psmisc
    - lshw
    - fontconfig
    # python (pipx and venv are used by the python tasks)
    - python3
    - python3-setuptools
    - python3-pip
    - python3-venv
    - python3-debian
    - pipx
    # libraries needed to build some cargo and python tools
    - libssl-dev
    - libgraphviz-dev
    - libdbus-glib-1-2
    - libncurses-dev
    - libfreetype-dev
    - libfontconfig1-dev
    - libxkbcommon-dev
    - libxcb1-dev
    - libxcb-render0-dev
    - libxcb-shape0-dev
    - libxcb-xfixes0-dev
    # shell and search
    - zsh
    - ripgrep
    - fzf
    - jq
    - tmux
    - direnv
    - fd-find
    - bat
    - lsd
    - eza
    - zoxide
    - tree
    - most
    - mc
    - nnn
    - ncdu
    - duf
    - htop
    - btop
    - hyperfine
    - just
    # code quality
    - shellcheck
    - shfmt
    - ansible-lint
    # docs and diagrams
    - pandoc
    - graphviz
    - plantuml
    - wkhtmltopdf
    # embedded and IoT
    - gdb
    - picocom
    - clang-format
    - cppcheck
    - tshark
    # runtimes and containers
    - default-jre
    - dotnet-sdk-8.0
    - podman
    # networking
    - net-tools
    - inetutils-traceroute
    # required for the snap and Wave Terminal installs
    - snapd
  personal:
    - flatpak
    - golang-go
    - wireless-tools
    - x11-apps
    - mate-terminal
    - python3-tk
    - vnstat
    - vnstati
    - neofetch
    - screenfetch
    - inxi
    - nmon
    - atop
    - bpytop
    - httrack
    - debian-goodies
    - cmatrix
    - cowsay
    - sl
    - figlet
    - libaa-bin
    - lolcat
    - aewan
    - jp2a
    - cbonsai
    - aview
    - chafa
    - stacer
    - slurm
    - bmon
    - tcptrack
    - speedometer
    - cpu-x
    - hardinfo

# Only installed when a Raspberry Pi is detected.
apt_raspberry_pi:
  base: []
  personal:
    - scratch3
    - realvnc-vnc-viewer

# Python libraries, installed into one virtualenv at ~/.venvs/tools (PEP 668
# stops pip installing into the system Python on current Ubuntu and Debian).
pip_libs:
  base:
    - wheel
    - markdown
    - pdfkit
    - diagrams
    - erd-from-json-table-schema
    - pdfminer.six[image]
    - pymupdf
    - aiohttp
    - openleadr
  personal:
    - pywebcopy

# Snap and flatpak are skipped on WSL (GUI apps belong on the Windows side).
# Wave Terminal is a GUI app too, so install it on Windows under WSL.
snap:
  base:
    - waveterm
  personal:
    - bashtop
    - nutty
    - krita
    - standard-notes
    - wekan
    - onefetch
    - fast
    - notepadqq
    - bottom
    - mqtt-explorer
    - mosquitto
    - redis
    - mapscii
    - asciiquarium
    - simplenote
    - joplin
    - dbgate

# Snaps that need --classic confinement.
snap_classic:
  base: []
  personal:
    - sublime-text
    - pycharm-community
    - alacritty

flatpak:
  base: []
  personal:
    - org.gaphor.Gaphor
    - dev.lapce.lapce
    - org.wezfurlong.wezterm
    - com.jetpackduba.Gitnuro

# Homebrew on Linux (installed by the "homebrew" installer below).
brew:
  base: []
  personal:
    - nushell
    - tokei
    - dust
    - gitui
    - eureka
    - dua
    - mdcat
    - topgrade
    - procs
    - trippy
    - macchina
    - daveshanley/vacuum/vacuum

# Nerd Fonts to install. Each needs a checksum in config/pins.yml.
fonts:
  base:
    - Meslo
    - Noto
    - RobotoMono
    - SourceCodePro
  personal: []

# Optional installers. Each downloads a pinned, checksum-verified file (see
# config/pins.yml) or adds a signed apt repository. Names match tasks in
# Linux/ansible/tasks/.
installers:
  base:
    - vscode
    - rustup
    - nvm
    - oh_my_zsh
  personal:
    - homebrew
    - chrome
    - ctop
    - browsh
    - pfetch
    - gitupdate
    - swagger_editor
