# Windows packages.
#
# Every top-level key has the same shape:
#   base:     safe for a work machine
#   personal: added on top when profile is "personal"
#
# Both keys must be present, even when empty. tests/validate_config.py checks this.
#
# winget IDs and Scoop names were checked against the winget-pkgs repository
# and the Scoop Main and Extras buckets. Chocolatey names come from the
# previous scripts and were not re-checked.

winget:
  base:
    - CommandLine.Wave
    - GitHub.cli
    - Microsoft.Teams
    - Rustlang.Rustup
  personal:
    - Valve.Steam
    - EpicGames.EpicGamesLauncher
    - Microsoft.VisualStudio.2022.Community

