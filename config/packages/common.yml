# Packages that install the same way on every OS.
#
# Every top-level key has the same shape:
#   base:     safe for a work machine
#   personal: added on top when profile is "personal"
#
# Both keys must be present, even when empty. tests/validate_config.py checks this.

# Built from source with "cargo install". Needs rustup (see linux.yml installers).
cargo:
  base:
    - mdbook
    - mdbook-pdf
    - mdbook-plantuml
    - mdbook-codeblocks
    - mdbook-mermaid
    - cargo-update
    - rink
  personal:
    - lfs
    - rust-kanban
    - kanorg
    - rh
    - xplr

# Installed globally with npm (Node comes from nvm on Linux).
npm:
  base:
    - "@asyncapi/cli"
    - "@asyncapi/generator"
    - "@asyncapi/modelina"
    - "@asyncapi/parser"
    - mock-to-openapi
    - ungit
    - create-openapi-repo
    - markdownlint-cli2
    - "@mermaid-js/mermaid-cli"
  personal:
    - vtop
    - gtop

# Python command line tools, installed with pipx so each gets its own environment.
pipx:
  base:
    - yamllint
    - pre-commit
    - httpie
    - adr-tools-python
    - adr-viewer
    - pyadr
    - aafigure
    - mdbook-pdf-outline
  personal:
    - glances
    - hyfetch

