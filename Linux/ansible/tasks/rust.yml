---
- name: Install rustup and the cargo packages
  when: "'rustup' in want.installers"
  vars:
    rust_target: "{{ {'amd64': 'x86_64-unknown-linux-gnu', 'arm64': 'aarch64-unknown-linux-gnu', 'armhf': 'armv7-unknown-linux-gnueabihf'}[deb_arch] }}"
    rustup_url: "https://static.rust-lang.org/rustup/archive/{{ pins.rustup.version }}/{{ rust_target }}/rustup-init"
    cargo_bin: "{{ home }}/.cargo/bin"
  environment:
    PATH: "{{ cargo_bin }}:{{ ansible_facts.env.PATH }}"
  block:
    - name: Download rustup-init (pinned version, checksum from the same release)
      ansible.builtin.get_url:
        url: "{{ rustup_url }}"
        dest: "{{ cache_dir }}/rustup-init-{{ pins.rustup.version }}"
        checksum: "sha256:{{ rustup_url }}.sha256"
        mode: "0700"

    - name: Install the Rust toolchain
      ansible.builtin.command: "{{ cache_dir }}/rustup-init-{{ pins.rustup.version }} -y --no-modify-path --profile minimal"
      args:
        creates: "{{ cargo_bin }}/rustc"

    - name: Install the cargo packages
      community.general.cargo:
        name: "{{ want.cargo }}"
        locked: true
        executable: "{{ cargo_bin }}/cargo"
      when: want.cargo | length > 0
