# Every package this repo installs, in one file.
#
# Layout: platform (common, linux, windows) > group (apt, scoop, npm, ...) > tier.
# Each group has exactly two tiers, and both must be present even when empty:
#   base:     safe for a work machine
#   personal: added on top when profile is "personal"
#
# common applies to Linux and Windows alike. tests/validate_config.py checks the shape.
# After editing, run: python3 docs/generate_packages.py


# Packages that install the same way on every OS.
common:
  # Built from source with "cargo install". Needs rustup (see linux.yml installers).
  cargo:
    base:
      - mdbook
      - mdbook-pdf
      - mdbook-plantuml
      - mdbook-codeblocks
      - mdbook-mermaid
      - cargo-update
      - rink
    personal:
      - lfs
      - rust-kanban
      - kanorg
      - rh
      - xplr

  # Installed globally with npm (Node comes from nvm on Linux).
  npm:
    base:
      - "@asyncapi/cli"
      - "@asyncapi/generator"
      - "@asyncapi/modelina"
      - "@asyncapi/parser"
      - mock-to-openapi
      - ungit
      - create-openapi-repo
      - markdownlint-cli2
      - "@mermaid-js/mermaid-cli"
    personal:
      - vtop
      - gtop

  # Python command line tools, installed with pipx so each gets its own environment.
  pipx:
    base:
      - yamllint
      - pre-commit
      - httpie
      - adr-tools-python
      - adr-viewer
      - pyadr
      - aafigure
      - mdbook-pdf-outline
    personal:
      - glances
      - hyfetch

  # Extension IDs for "code --install-extension".
  vscode_extensions:
    base:
      - 42Crunch.vscode-openapi
      - aaron-bond.better-comments
      - alefragnani.project-manager
      - anweber.httpbook
      - anweber.vscode-httpyac
      - aprilandjan.ascii-tree-generator
      - asyncapi.asyncapi-preview
      - AykutSarac.jsoncrack-vscode
      - batisteo.vscode-django
      - bierner.markdown-mermaid
      - BitBelt.converttoasciiart
      - bmlsolutions.dotuml
      - bpruitt-goddard.mermaid-markdown-syntax-highlighting
      - buianhthang.xml2json
      - chrmarti.regex
      - daiyy.quick-html-previewer
      - DavidAnson.vscode-markdownlint
      - derek-nextty.openapi-viewer
      - docsmsft.docs-yaml
      - donjayamanne.python-environment-manager
      - donjayamanne.python-extension-pack
      - DotJoshJohnson.xml
      - DougFinke.vscode-pandoc
      - eamodio.gitlens
      - esbenp.prettier-vscode
      - fernandoescolar.vscode-solution-explorer
      - GitHub.vscode-pull-request-github
      - googlecloudtools.cloudcode
      - Gruntfuggly.todo-tree
      - hashicorp.terraform
      - hediet.vscode-drawio
      - jebbs.plantuml
      - johnpapa.vscode-peacock
      - kamikillerto.vscode-colorize
      - KevinRose.vsc-python-indent
      - maattdd.gitless
      - Markwhen.markwhen
      - marp-team.marp-vscode
      - MartinPicard.vscode-openapi
      - mermade.openapi-lint
      - mirone.milkdown
      - mkloubert.vscode-kanban
      - mohsen1.prettify-json
      - ms-dotnettools.csharp
      - ms-python.python
      - ms-toolsai.jupyter-keymap
